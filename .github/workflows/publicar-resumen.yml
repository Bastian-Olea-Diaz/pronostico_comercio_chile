name: Publicar resumen

# Regenera resumen.json desde la última release y lo publica en GitHub Pages, sin procesar datos ni reentrenar.
# Útil después de cambiar las variables TABLERO_URL o API_URL, de corregir nombres de productos en el
# proyecto de análisis, o si hubo que volver a publicar el sitio.
on:
  workflow_dispatch:

jobs:
  resumen:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e .
      - name: Descargar la última release
        run: gh release download --pattern '*' --dir state
      # Nombres de productos vigentes del proyecto de análisis, para no esperar a la próxima actualización mensual
      - uses: actions/checkout@v4
        with:
          repository: Bastian-Olea-Diaz/analisis_comercio_chile
          ref: ${{ vars.BASE_REF || 'main' }}
          path: base
          sparse-checkout: references/codigos
      - name: Generar resumen
        env:
          TABLERO_URL: ${{ vars.TABLERO_URL }}
          API_URL: ${{ vars.API_URL }}
        run: |
          names=base/references/codigos/hs6_nombres.csv
          python -m pronostico.resumen --estado state --salida site $([ -f "$names" ] && echo "--etiquetas $names")
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: resumen
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
