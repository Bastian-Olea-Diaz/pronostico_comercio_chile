[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pronostico-comercio-chile"
version = "0.1.0"
description = "Pronóstico mensual del comercio exterior de Chile en producción: pipeline, monitoreo, API y tablero"
requires-python = ">=3.11"
# El pipeline además necesita el paquete comercio_chile (repositorio analisis_comercio_chile), instalado en modo
# editable desde una copia del repositorio porque usa sus tablas de referencia: ver README.
dependencies = ["pandas>=2.2", "pyarrow>=17.0", "requests>=2.32"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dashboard = ["streamlit>=1.40", "altair>=5.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
